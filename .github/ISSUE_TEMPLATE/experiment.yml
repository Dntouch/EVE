name: Experiment
description: Einen reproduzierbaren Versuch planen
title: "[Experiment] "
labels: []
body:
  - type: input
    id: forschungsfrage
    attributes:
      label: Forschungsfrage
      placeholder: RQ-001
    validations:
      required: true
  - type: textarea
    id: ziel
    attributes:
      label: Untersuchte Aufgabe
      description: Welche für EVE unbekannte Aufgabe wird untersucht?
    validations:
      required: true
  - type: textarea
    id: ausgangszustand
    attributes:
      label: Ausgangszustand und Ereignisse
      description: Neuronaler Zustand, Zufallszustände, Umweltbedingungen und Ereignisfolge
    validations:
      required: true
  - type: textarea
    id: konsequenzen
    attributes:
      label: Entscheidungen und Konsequenzen
      description: Welche Entscheidungen kann EVE treffen und welche Konsequenzen wahrnehmen?
    validations:
      required: true
  - type: textarea
    id: kontrollen
    attributes:
      label: Abgrenzung möglicher Erklärungen
      description: Wie werden Zufall, feste Lösungswege und Lehrerentscheidungen ausgeschlossen?
    validations:
      required: true
  - type: textarea
    id: beobachtung
    attributes:
      label: Beobachtete Größen
      description: Welche der im Konzept genannten Größen werden aufgezeichnet?
    validations:
      required: true
